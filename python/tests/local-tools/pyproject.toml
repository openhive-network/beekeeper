[build-system]
build-backend = "poetry_dynamic_versioning.backend"
requires = [
  "poetry-core==2.1.3",
  "poetry-dynamic-versioning>=1.0.0,<2.0.0",
]

[tool.poetry]
requires-poetry = "2.1.3"
authors = [
  "Mateusz Żebrak <mzebrak@syncad.com>",
  "Krzysztof Mochocki <kmochocki@syncad.com>",
]
description = "Pack of tools and dependencies for running beekeepy tests."
name = "local-tools"
packages = [
  {include = "local_tools"},
]
repository = "https://gitlab.syncad.com/hive/beekeeper"
source = [
  {name = "PyPI", priority = "primary"},
  {name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary"},
]
version = "0.0.0"

[tool.poetry.dependencies]
python = ">=3.12,<4"
