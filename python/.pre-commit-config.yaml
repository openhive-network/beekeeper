repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [ "--unsafe" ]
      - id: check-json
        exclude: "programs/"
      - id: pretty-format-json
        args: [ "--autofix" ]
        exclude: "programs/"
      - id: trailing-whitespace
        exclude: ".*_pattern.txt|.*wallet|programs/"
      - id: end-of-file-fixer
        exclude: ".*_pattern.txt|.*wallet|programs/"
  - repo: https://github.com/python-poetry/poetry
    rev: 2.1.3
    hooks:
      - id: poetry-lock
        name: checking if python/poetry.lock is consistent with pyproject.toml
        args: [ "-C", "./python" ]
        language_version: python3.14
  - repo: https://github.com/python-poetry/poetry
    rev: 2.1.3
    hooks:
      - id: poetry-lock
        name: checking if tests/local-tools/poetry.lock is consistent with pyproject.toml
        args: [ "-C", "./python/tests/local-tools" ]
        language_version: python3.14
  - repo: local
    hooks:
      - id: ruff
        name: linting code with Ruff
        entry: ruff check --fix --config ./python/pyproject.toml
        language: system
        types: [python]
      - id: ruff-format
        name: format code using Ruff formatter
        entry: ruff format --config ./python/pyproject.toml
        language: system
        types: [python]
      - id: mypy
        name: type check with mypy
        entry: mypy
        args: ["--config-file", "./python/pyproject.toml"]
        language: system
        types: [python]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
    - id: codespell
      exclude: "programs/|swagger-ui"
  - repo: https://github.com/lk16/detect-missing-init
    rev: v0.1.6
    hooks:
      - id: detect-missing-init
        args:
          - "--create"
          - "--python-folders"
          - "\
            python/beekeepy, \
            python/tests/beekeepy_test,
            "
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        exclude: "programs/"
