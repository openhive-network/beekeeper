# Profile for hive/beekeeper, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: beekeeper

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/beekeeper"
  id: 558

# A single-branch topology: this is both what work integrates into and what
# ships. `stable` is omitted rather than declared equal to it — declaring
# them equal is a typo, omitting one is a topology. Add `stable:` when this
# project genuinely promotes to a second branch.
# AIDEV integrates into its own branch; people merge it into master through
# merge requests, so `stable` is omitted and `aidev release` never moves master.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/beekeeper/aidev-tests@sha256:5d671486c18f4b4fe73a0dade11235f27d27d8386c887b74a5ec3cf951d213e6"
  inputs: ["programs/beekeeper/beekeeper_wasm/pnpm-lock.yaml", "python/poetry.lock", "python/tests/local-tools/poetry.lock"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Steps (.aidev/run-checks.sh, see .aidev/README.md): wasm = emscripten build of
# the WASM module; build/typecheck/test = the @hiveio/beekeeper TS package and
# its Playwright suite; native/native-test = the C++ daemon and its Boost.Test
# suite; beekeepy = the Python wrapper's pytest suite against that daemon;
# py-* = ruff and mypy. There is no coverage tooling: `coverage` runs the native
# and Python suites without measuring.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "wasm", "build", "test", "py-format", "py-lint", "py-types"]
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "wasm", "build", "test", "native", "native-test", "beekeepy", "py-format", "py-lint", "py-types"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "wasm", "build", "test", "native", "native-test", "beekeepy"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "wasm", "build", "test", "native", "native-test", "beekeepy", "py-format", "py-lint", "py-types"]
    artifacts: ["test-results/canary/"]
  static:
    adapter: command
    args: [".aidev/run-checks.sh", "static", "wasm", "typecheck", "py-format", "py-lint", "py-types"]
    artifacts: ["test-results/static/"]
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "native", "native-test", "beekeepy"]
    artifacts: ["test-results/coverage/"]
  system:
    adapter: command
    args: [".aidev/run-checks.sh", "system", "wasm", "build", "test", "native", "beekeepy"]
    artifacts: ["test-results/system/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
