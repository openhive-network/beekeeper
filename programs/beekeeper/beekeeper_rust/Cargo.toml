[package]
name = "beekeeper_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0.194"
thiserror = "2.0.18"
sha2 = "0.10"
ripemd = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
bs58 = "0.5"
rand = "0.8"

[build-dependencies]
cxx-build = "1.0.194"

[dev-dependencies]
tempfile = "3"
