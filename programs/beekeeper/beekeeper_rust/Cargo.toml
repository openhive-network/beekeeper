[package]
name = "hiveio-beekeeper"
version = "0.0.0"
edition = "2024"
description = "Rust bindings for Hive Beekeeper — a wallet / private-key manager for the Hive blockchain."
license = "MIT"
repository = "https://gitlab.syncad.com/hive/wax"
homepage = "https://gitlab.syncad.com/hive/wax"
readme = "README.md"
keywords = ["hive", "blockchain", "beekeeper", "wallet", "keys"]
categories = ["cryptography::cryptocurrencies"]
# The published crate ships the prelinked native bundle (see
# prelink_bundle.sh) instead of the C++ sources it was built from.
include = [
    "src/**",
    "build.rs",
    "lib/libbeekeeper_native.a",
    "README.md",
]

[lib]
name = "beekeeper"

[dependencies]
# Pinned exactly: the prelinked bundle bakes in C++ generated by this cxx
# version, and the cxx runtime cargo links into the consumer must match it.
cxx = "=1.0.194"
thiserror = "2.0.18"

[build-dependencies]
cxx-build = "=1.0.194"
cmake = "0.1"

[dev-dependencies]
tempfile = "3"
